<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Radial inner glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Outer ring border glow (blurred) -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5" filter="url(#blur1)"/>
  <!-- Outer ring border sharp -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#60a5fa" stroke-width="0.6" opacity="0.8"/>

  <!-- === ByteSync "S" sync arcs logo === -->

  <!-- Top arc (blue glow — blurred layer) -->
  <path d="M 20 22 A 14 14 0 0 1 44 22" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" opacity="0.5" filter="url(#blur1)"/>
  <!-- Top arc (blue — sharp) -->
  <path d="M 20 22 A 14 14 0 0 1 44 22" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>

  <!-- Connector dot center -->
  <circle cx="32" cy="32" r="3.5" fill="#10b981" opacity="0.9"/>
  <circle cx="32" cy="32" r="5" fill="#10b981" opacity="0.25" filter="url(#blur1)"/>

  <!-- Bottom arc (green glow — blurred layer) -->
  <path d="M 44 42 A 14 14 0 0 1 20 42" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" opacity="0.5" filter="url(#blur1)"/>
  <!-- Bottom arc (green — sharp) -->
  <path d="M 44 42 A 14 14 0 0 1 20 42" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>

  <!-- Arrow tip top-right (blue) -->
  <polyline points="41,18 44,22 40,24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow tip bottom-left (green) -->
  <polyline points="23,46 20,42 24,40" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clip everything to circle -->
  <clipPath id="clip"><circle cx="32" cy="32" r="32"/></clipPath>
</svg>
